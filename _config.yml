# Site settings
title: 기록 위키
url: "https://vision99.github.io"
baseurl: ""
description: >
    두서없는 기록 위키

# My information
email: hwieun0104@gmail.com
author: hwieun 
profile: 개발자
github_username: Hwieun
comment-support: utterances

# Build settings
plugins:
  - jekyll-paginate
  - jekyll-gist

permalink: /blog/:year/:month/:day/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

paginate: 10
paginator_path: "/blog"
paginate_path: "/blog/page:num/"

# Collections
collections:
    wiki:
        output: true
        permalink: /:collection/:path/

# Comment Service
giscus:
  repo: Hwieun/hwieun.github.io
  repo_id: SAMPLE-VALUE
  category: Announcements
  category_id: SAMPLE-VALUE

google_analytics:
  ua: SAMPLE-VALUE
  encrypted_ua: THIS-IS-SAMPLE-VALUE

google_adsense:
  client: SAMPLE-VALUE

blame: "https://github.com/Hwieun/hwieun.github.io/blame/master/_wiki"
edit: "https://github.com/Hwieun/hwieun.github.io/edit/master/_wiki"
issue: "https://github.com/Hwieun/hwieun.github.io/issues/new"

timezone: "Asia/Seoul"

# https://kramdown.gettalong.org/rdoc/Kramdown/Options.html - smart_quotes
kramdown:
    smart_quotes: ["apos", "apos", "quot", "quot"]
